# Pipeline de CI - Validação de manifestos YAML - cluster-kubernetes
# Implementação completa: Story 1.4

name: lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

# Prevenção de jobs concorrentes (cancela execuções pendentes na mesma branch ao enviar novos commits)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Hardening: Princípio do Menor Privilégio
permissions:
  contents: read

jobs:
  validate:
    name: Compilar e Validar Manifestos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Hardening: Pinar checkout por SHA estável do commit do checkout v4.1.7 e desativar persistência de credenciais
      - name: Checkout do Código
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf33db # v4.1.7
        with:
          persist-credentials: false

      # Instala kustomize com versão pinada — fallback kubectl kustomize não garante versão consistente
      - name: Instalar kustomize v5.8.1
        run: |
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin kustomize
          chmod +x /usr/local/bin/kustomize
          kustomize version

      # Instala conftest nativamente para evitar pull de imagem Docker no linter
      - name: Instalar conftest v0.68.2
        run: |
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v0.68.2/conftest_0.68.2_Linux_x86_64.tar.gz" \
            | tar xz -C /usr/local/bin conftest
          chmod +x /usr/local/bin/conftest
          conftest --version

      # Executa a esteira unificada de validação (Kustomize + kebab-case + kube-linter)
      - name: Executar Validação de Lint (Unificado)
        run: |
          chmod +x scripts/lint.sh
          ./scripts/lint.sh
