[workflow]
persistent_facts = [
  "CRITICAL REQUIREMENT [IMPLEMENTATION RULES]: Você DEVE avaliar o código estritamente contra as regras definidas em `_bmad-output/distillate/01-regras-implementacao.md`.",
  "CRITICAL REQUIREMENT [DEFERRED WORK]: Verifique e documente novos itens em `_bmad-output/distillate/04-trabalho-diferido.md` caso identifique problemas fora do escopo imediato da story.",
  "CRITICAL REQUIREMENT [VALIDAÇÃO PÓS-PATCH]: Após aplicar todos os patches, HALT. Pergunte ao usuário: 'Os testes e validações do Plano de Validação Manual da story continuam passando? (sim/não)'. Aguarde resposta antes de prosseguir. Se `sim`: marque a story como `done`. Se `não`: pergunte quais testes falharam, registre no Change Log da story e defina o status como `in-progress`."
]

