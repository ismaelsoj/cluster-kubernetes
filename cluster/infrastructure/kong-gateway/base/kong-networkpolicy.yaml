# NetworkPolicy do Kong - ingress aberto nas portas de borda e egress mínimo explícito
# Permite DNS e comunicação futura com o Keycloak/JWKS sem expor o Admin API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kong-networkpolicy
  namespace: kong-gateway
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: cluster-kubernetes
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kong
      app.kubernetes.io/component: gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 8100
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak-auth
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
              app.kubernetes.io/component: identity-provider
      ports:
        - protocol: TCP
          port: 8080

