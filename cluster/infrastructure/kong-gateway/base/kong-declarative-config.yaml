# ConfigMap da configuração declarativa do Kong DB-Less - borda TLS, OIDC e rate limit
# Montado como arquivo em /kong/declarative/kong.yml via volumeMount + subPath.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative-config
  namespace: kong-gateway
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: cluster-kubernetes
  annotations:
    argocd.argoproj.io/sync-wave: "3"
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true

    # Rate limit default global: aplica-se a toda requisição sem limite próprio.
    # Rotas podem sobrescrever com plugin rate-limiting específico (precedência por rota).
    # NOTA (2026-07-06): plugin foi mantido no scope creep aceito da Story 3.1;
    # Story 3.2 refina policy (local → cluster/redis) e limites por consumidor.
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          policy: local

    services:
      - name: keycloak-public-service
        host: keycloak-service.keycloak-auth.svc.cluster.local
        port: 80
        protocol: http
        routes:
          - name: keycloak-http-block-route
            hosts:
              - localhost
              - keycloak.local
            paths:
              - /
            preserve_host: true
            strip_path: false
            protocols:
              - http
            plugins:
              - name: request-termination
                config:
                  status_code: 426
                  message: "Use HTTPS on https://localhost"
          - name: keycloak-oidc-public-route
            hosts:
              - localhost
              - keycloak.local
            paths:
              - /.well-known
              - /realms/cluster-local/.well-known
              - /realms/cluster-local/protocol/openid-connect/certs
              - /realms/cluster-local/protocol/openid-connect/token
              - /resources
            preserve_host: true
            strip_path: false
            protocols:
              - https
      - name: oauth2-proxy-service
        host: oauth2-proxy-service.kong-gateway.svc.cluster.local
        port: 4180
        protocol: http
        routes:
          - name: oauth2-proxy-callback-route
            hosts:
              - localhost
              - keycloak.local
            paths:
              - /oauth2
            preserve_host: true
            strip_path: false
            protocols:
              - https
          - name: keycloak-protected-route
            hosts:
              - localhost
              - keycloak.local
            paths:
              - /protected
            preserve_host: true
            strip_path: true
            protocols:
              - https
            plugins:
              - name: rate-limiting
                config:
                  minute: 100
                  policy: local

