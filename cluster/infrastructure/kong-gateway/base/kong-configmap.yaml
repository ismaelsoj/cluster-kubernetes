# ConfigMap de variáveis de ambiente do Kong DB-Less - gateway de borda da plataforma
# Contém apenas env vars do runtime; a configuração declarativa está em kong-declarative-config.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-configmap
  namespace: kong-gateway
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: cluster-kubernetes
  annotations:
    argocd.argoproj.io/sync-wave: "3"
data:
  KONG_DATABASE: "off"
  KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
  KONG_PREFIX: /var/run/kong
  KONG_STATUS_LISTEN: 0.0.0.0:8100
  KONG_ADMIN_LISTEN: "off"
  KONG_PROXY_LISTEN: 0.0.0.0:8000 reuseport backlog=16384, 0.0.0.0:8443 http2 ssl reuseport backlog=16384
  KONG_SSL_CERT: /etc/kong/tls/tls.crt
  KONG_SSL_CERT_KEY: /etc/kong/tls/tls.key
  KONG_PROXY_ACCESS_LOG: /dev/stdout kong_json
  KONG_PROXY_ERROR_LOG: /dev/stderr
  KONG_LOG_LEVEL: notice
  KONG_NGINX_WORKER_PROCESSES: "auto"
  KONG_NGINX_HTTP_LOG_FORMAT: >-
    kong_json escape=json '{"time":"$time_iso8601","request_id":"$kong_request_id","client_ip":"$remote_addr","host":"$host","method":"$request_method","uri":"$request_uri","status":$status,"bytes_sent":$bytes_sent,"request_time":$request_time,"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status","upstream_response_time":"$upstream_response_time","user_agent":"$http_user_agent"}'

