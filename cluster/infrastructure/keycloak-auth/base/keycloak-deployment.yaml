# Deployment principal do Keycloak - Identity Provider OIDC da plataforma
# Conecta-se ao PostgreSQL via serviço interno com credenciais injetadas via secret
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-deployment
  namespace: keycloak-auth
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity-provider
    app.kubernetes.io/part-of: cluster-kubernetes
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Keycloak 26 escreve em /opt/keycloak/lib/quarkus/ na augmentation do Quarkus a cada boot.
    # readOnlyRootFilesystem requer imagem pré-compilada com --optimized (fora do escopo do MVP).
    ignore-check.kube-linter.io/no-read-only-root-fs: "Keycloak augmentation grava em /opt/keycloak/lib/quarkus — aplicavel apos imagem customizada com kc.sh build --optimized"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/component: identity-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: identity-provider
        app.kubernetes.io/part-of: cluster-kubernetes
    spec:
      priorityClassName: keycloak-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.6.2
          args:
            - start
            - --import-realm
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          env:
            # Conexão com PostgreSQL
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgresql-service.keycloak-auth.svc.cluster.local:5432/keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: database-user
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: database-password
            # Observabilidade e saúde
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_LOG_CONSOLE_OUTPUT
              value: json
            - name: KC_SPI_EVENTS_LISTENER__JBOSS_LOGGING__SUCCESS_LEVEL
              value: info
            # Rede e proxy (TLS encerrado no edge pelo Kong na Wave 3)
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME
              value: https://localhost
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            # Credenciais bootstrap do console administrativo
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: admin-username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: admin-password
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9000
              name: management
          startupProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - mountPath: /opt/keycloak/data
              name: keycloak-data
            - mountPath: /tmp
              name: keycloak-tmp
            - mountPath: /opt/keycloak/data/import
              name: realm-config-volume
              readOnly: true
      volumes:
        - name: keycloak-data
          emptyDir: {}
        - name: keycloak-tmp
          emptyDir: {}
        - name: realm-config-volume
          configMap:
            name: keycloak-realm-config

