# Kustomization base - keycloak-auth - cluster-kubernetes
# Wave 1 (PostgreSQL) + Wave 2 (Keycloak) — provedor de identidade da plataforma
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: keycloak-auth

resources:
  # Wave 1 — PostgreSQL (banco de dados do Keycloak)
  - postgresql-pvc.yaml
  - postgresql-deployment.yaml
  - postgresql-service.yaml
  - postgresql-networkpolicy.yaml
  # Wave 2 — Keycloak (Identity Provider OIDC)
  - keycloak-priorityclass.yaml
  - keycloak-deployment.yaml
  - keycloak-service.yaml

configMapGenerator:
  - name: keycloak-realm-config
    files:
      - realm-config.json
    options:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: identity-provider
        app.kubernetes.io/part-of: cluster-kubernetes
      annotations:
        argocd.argoproj.io/sync-wave: "2"

